[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemind"
version = "0.1.0"
description = "Autonomous software-engineering agent: GitHub issue -> investigate -> implement -> test -> review -> PR. Foundation, runtimes, git tools, LLM provider, planning + research + developer + test + debugger + reviewer + security agents (Phases 1-9)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "arq>=0.26",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# End-to-end suite (tests_e2e/) needs Docker Postgres + Redis and is run
# separately: `pytest tests_e2e/` — see README.
