<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeMind — {{ title }}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           margin:0; background:#f7f9fb; color:#1c2430; }
    .wrap { max-width:560px; margin:0 auto; padding:64px 16px; text-align:center; }
    .card { background:#fff; border:1px solid #d8dee6; border-radius:10px; padding:32px 24px; }
    h1 { font-size:22px; margin:0 0 10px; }
    p { color:#6b7684; font-size:14px; margin:0 0 18px; }
    code { background:#eef1f5; padding:1px 5px; border-radius:4px; font-size:12px; }
    a { color:#3448a0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Task not found</h1>
      <p>No task exists with the id <code>{{ task_id }}</code>.</p>
      <p><a href="/tasks">Back to the task list</a></p>
    </div>
  </div>
</body>
</html>
